!==============================================================================
! CISCO CATALYST IE-3400-8P4S INDUSTRIAL ETHERNET SWITCH (IDF-2: FACTORY FLOOR)
! 20-Camera Industrial CCTV & High-Availability Factory Network Architecture
! Author: Senior Network & Security Infrastructure Architect
! OS: Cisco IOS-XE Amsterdam 17.9.4a (Ruggedized Platform)
!==============================================================================

version 17.9
no service pad
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname SW-ACC-IDF2
!
ip domain-name factory.internal
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh server algorithm encryption chacha20-poly1305@openssh.com aes256-gcm@openssh.com
!
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default enable
username secadmin privilege 15 secret 9 $9$8xKa.Z9bW4o$xQ.R1lTfN7/4mK8pQe0Z5J.7L2vO
!
alarm contact 1 description "IDF-2 Factory Enclosure Tamper Switch"
alarm contact 1 severity major
alarm contact 1 trigger closed
alarm contact 2 description "IDF-2 Ambient Thermal Probe (>55C)"
alarm contact 2 severity critical
alarm contact 2 trigger open
!
system mtu 9198
spanning-tree mode mst
spanning-tree mst configuration
 name FACTORY-CCTV-FABRIC
 revision 1
 instance 1 vlan 20-22,30,50
!
spanning-tree portfast edge bpduguard default
!
ip dhcp snooping
ip dhcp snooping vlan 21
no ip dhcp snooping information option
ip arp inspection vlan 21
!
class-map match-any CM-CCTV-STREAM
 match access-group name ACL-RTSP-STREAM
!
ip access-list extended ACL-RTSP-STREAM
 permit tcp any any eq 554
 permit udp any any range 16384 32767
 permit tcp any any eq 80
 permit tcp any any eq 443
!
policy-map PM-EDGE-CAMERA-IN
 class CM-CCTV-STREAM
  set dscp af41
  set cos 4
 class class-default
  set dscp default
  set cos 0
!
vlan 10
 name OOBM-MGMT
!
vlan 21
 name CCTV-FACTORY
!
vlan 666
 name QUARANTINE-BLACKHOLE
!
! --- FACTORY PRODUCTION LINE CAMERA PORTS (1 TO 8: AXIS P3265-LV 60FPS) ---
interface range GigabitEthernet1/1 - 8
 switchport access vlan 21
 switchport mode access
 switchport nonegotiate
 switchport block unicast
 power inline auto
 service-policy input PM-EDGE-CAMERA-IN
 storm-control broadcast level 0.50
 storm-control multicast level 1.00
 storm-control action shutdown
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 ip arp inspection limit rate 15
 ip verify source
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/1
 description "CAM-09: Axis P3265-LV - Line 1 Feeding Station"
!
interface GigabitEthernet1/2
 description "CAM-10: Axis P3265-LV - Line 1 Stamping Press"
!
interface GigabitEthernet1/3
 description "CAM-11: Axis P3265-LV - Line 1 Robotic Assembly"
!
interface GigabitEthernet1/4
 description "CAM-12: Axis P3265-LV - Line 2 Robotic Cell"
!
interface GigabitEthernet1/5
 description "CAM-13: Axis P3265-LV - Line 2 Arc Welding Cell"
!
interface GigabitEthernet1/6
 description "CAM-14: Axis P3265-LV - Line 2 Optical Quality Check"
!
interface GigabitEthernet1/7
 description "CAM-15: Axis P3265-LV - High-Bay Aisle 1 (Forklifts)"
!
interface GigabitEthernet1/8
 description "CAM-16: Axis P3265-LV - High-Bay Aisle 2 (Automated Rack)"
!
! --- 10G SFP+ UPLINK PORT-CHANNEL TO CORE SWITCH STACK ---
interface Port-channel2
 description "Dual 10G LACP Uplink Trunk to SW-CORE-STK"
 switchport mode trunk
 switchport trunk allowed vlan 10,21,666
 switchport trunk native vlan 666
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface TenGigabitEthernet1/1
 description "Fiber Trunk Uplink Path A to SW-CORE-STK (Sw1 Te1/0/2)"
 switchport mode trunk
 channel-group 2 mode active
!
interface TenGigabitEthernet1/2
 description "Fiber Trunk Uplink Path B to SW-CORE-STK (Sw2 Te2/0/2)"
 switchport mode trunk
 channel-group 2 mode active
!
interface Vlan10
 description "OOBM Management SVI"
 ip address 10.240.10.12 255.255.255.0
 no shutdown
!
ip default-gateway 10.240.10.1
!
ntp server 10.240.10.1 prefer
snmp-server engineID local 80000009030000408CE10012
snmp-server group SECGROUP v3 priv
snmp-server user secuser SECGROUP v3 auth sha MyStr0ngAuthP@ss! priv aes 256 MyStr0ngPr1vP@ss!
snmp-server host 10.240.10.35 version 3 priv secuser
!
line con 0
 exec-timeout 5 0
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 transport output none
!
end
