#==============================================================================
# FORTINET FORTIGATE 100F HIGH-AVAILABILITY CLUSTER CONFIGURATION (FORTIOS 7.2)
# 20-Camera Industrial CCTV & High-Availability Factory Network Architecture
# Author: Senior Network & Security Infrastructure Architect
#==============================================================================

config system global
    set hostname "FW-FG100F-HA"
    set timezone "Europe/Rome"
    set admin-sport 8443
    set admin-ssh-port 22
    set strong-crypto enable
end

# --- HIGH AVAILABILITY CONFIGURATION (FGCP ACTIVE-PASSIVE) ---
config system ha
    set group-id 50
    set group-name "CCTV-HA-CLUSTER"
    set mode a-p
    set password "Pr0t3ct3d-H@Clust3r-K3y!2026"
    set hbdev "ha1" 100 "ha2" 50
    set session-pickup enable
    set session-pickup-connectionless enable
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt"
            set gateway 10.240.10.1
        next
    end
    set override disable
    set priority 200
    set monitor "port1" "port2" "aggregate-core"
end

# --- LACP INTERFACE AGGREGATION TO CORE SWITCH STACK ---
config system aggregate-interface
    edit "aggregate-core"
        set member "port1" "port2"
        set lacp-mode active
        set lacp-speed fast
    next
end

# --- 802.1Q VLAN SUB-INTERFACES ---
config system interface
    edit "vlan99-transit"
        set vdom "root"
        set ip 10.240.99.1 255.255.255.248
        set allowaccess ping
        set interface "aggregate-core"
        set vlanid 99
        set description "L3 Routed Transit Link to Cisco Catalyst 9300 Core Stack"
    next
    edit "vlan50-soc"
        set vdom "root"
        set ip 10.240.50.1 255.255.255.192
        set allowaccess ping
        set interface "aggregate-core"
        set vlanid 50
        set description "Gateway for Security Operations Center (SOC) Workstations"
    next
    edit "vlan10-mgmt"
        set vdom "root"
        set ip 10.240.10.1 255.255.255.0
        set allowaccess ping https ssh
        set interface "aggregate-core"
        set vlanid 10
        set description "Out-of-band Management Network Gateway"
    next
    edit "wan1"
        set vdom "root"
        set mode static
        set ip 198.51.100.2 255.255.255.248
        set allowaccess ping
        set description "Primary Fiber Internet Uplink (Encrypted Remote Telemetry)"
    next
end

# --- FIREWALL ADDRESS OBJECTS ---
config firewall address
    edit "NET_CCTV_PERIMETER"
        set subnet 10.240.20.0 255.255.255.0
    next
    edit "NET_CCTV_FACTORY"
        set subnet 10.240.21.0 255.255.255.0
    next
    edit "NET_CCTV_ANPR"
        set subnet 10.240.22.0 255.255.255.0
    next
    edit "HOST_SRV_VMS_AI"
        set subnet 10.240.30.10 255.255.255.255
    next
    edit "NET_SOC_CLIENTS"
        set subnet 10.240.50.0 255.255.255.192
    next
    edit "NET_MGMT_OOBM"
        set subnet 10.240.10.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "GRP_CCTV_CAMERAS_ALL"
        set member "NET_CCTV_PERIMETER" "NET_CCTV_FACTORY" "NET_CCTV_ANPR"
    next
end

# --- CUSTOM SERVICES DEFINITIONS ---
config firewall service custom
    edit "SRV_RTSP_STREAM"
        set category "Network Services"
        set protocol TCP
        set tcp-portrange 554
    next
    edit "SRV_RTP_VIDEO_PAYLOAD"
        set category "Network Services"
        set protocol UDP
        set udp-portrange 16384-32767
    next
    edit "SRV_ONVIF_CONTROL"
        set category "Web Services"
        set protocol TCP
        set tcp-portrange 80 443
    next
    edit "SRV_VMS_SMART_CLIENT"
        set category "General Services"
        set protocol TCP
        set tcp-portrange 7563 443
    next
end

config firewall service group
    edit "GRP_CCTV_PROTOCOLS"
        set member "SRV_RTSP_STREAM" "SRV_RTP_VIDEO_PAYLOAD" "SRV_ONVIF_CONTROL" "HTTPS"
    next
end

# --- INTRUSION PREVENTION SYSTEM (IPS) PROFILE ---
config ips sensor
    edit "IPS_INDUSTRIAL_CCTV"
        set comment "Strict Inspection for RTSP, ONVIF and Camera Firmware Exploits"
        config entries
            edit 1
                set rule 48924 # RTSP Buffer Overflow Exploit Protection
                set status enable
                set action block
            next
            edit 2
                set rule 36712 # ONVIF Authentication Bypass Mitigation
                set status enable
                set action block
            next
            edit 3
                set location server
                set severity high critical
                set action block
            next
        end
    next
end

# --- ZERO-TRUST FIREWALL POLICIES ---
config firewall policy
    # 1. Cameras Ingestion to VMS Server (Strict Conduit)
    edit 101
        set name "CCTV_INGRESS_TO_VMS"
        set srcintf "vlan99-transit"
        set dstintf "vlan99-transit"
        set srcaddr "GRP_CCTV_CAMERAS_ALL"
        set dstaddr "HOST_SRV_VMS_AI"
        set action accept
        set schedule "always"
        set service "GRP_CCTV_PROTOCOLS"
        set utm-status enable
        set ips-sensor "IPS_INDUSTRIAL_CCTV"
        set logtraffic all
    next

    # 2. SOC Operators to VMS Video Platform
    edit 102
        set name "SOC_TO_VMS_CONSOLE"
        set srcintf "vlan50-soc"
        set dstintf "vlan99-transit"
        set srcaddr "NET_SOC_CLIENTS"
        set dstaddr "HOST_SRV_VMS_AI"
        set action accept
        set schedule "always"
        set service "SRV_VMS_SMART_CLIENT" "HTTPS" "PING"
        set utm-status enable
        set logtraffic all
    next

    # 3. Out-of-band Management to Core & Industrial Nodes
    edit 103
        set name "MGMT_AUTHORIZED_ACCESS"
        set srcintf "vlan10-mgmt"
        set dstintf "vlan99-transit" "aggregate-core"
        set srcaddr "NET_MGMT_OOBM"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SSH" "HTTPS" "SNMP" "NTP" "PING"
        set logtraffic all
    next

    # 4. Strict Block: Microsegmentation (Inter-Camera Lateral Movement Block)
    edit 990
        set name "BLOCK_CCTV_LATERAL_MOVEMENT"
        set srcintf "vlan99-transit"
        set dstintf "vlan99-transit"
        set srcaddr "GRP_CCTV_CAMERAS_ALL"
        set dstaddr "GRP_CCTV_CAMERAS_ALL"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # 5. Strict Block: Cameras to Public Internet (Airgap Enforcement)
    edit 991
        set name "BLOCK_CCTV_TO_INTERNET"
        set srcintf "vlan99-transit"
        set dstintf "wan1"
        set srcaddr "GRP_CCTV_CAMERAS_ALL"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

# --- STATIC & ROUTED OSPF CONFIGURATION ---
config router ospf
    set router-id 10.240.99.1
    config area
        edit 0.0.0.0
        next
    end
    config ospf-interface
        edit "ospf-transit"
            set interface "vlan99-transit"
            set cost 10
            set authentication md5
            set auth-key "0t_0spf_k3y_s3cur3!"
        next
    end
    config network
        edit 1
            set prefix 10.240.99.0 255.255.255.248
            set area 0.0.0.0
        next
    end
end

# --- SYSLOG LOG FORWARDING TO CENTRAL SIEM ---
config log syslogd setting
    set status enable
    set server "10.240.10.35"
    set mode udp
    set port 514
    set facility local7
end
