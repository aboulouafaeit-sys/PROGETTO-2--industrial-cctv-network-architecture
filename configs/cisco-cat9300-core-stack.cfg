!==============================================================================
! CISCO CATALYST 9300-24S CORE SWITCH STACK CONFIGURATION (STACKWISE-480)
! 20-Camera Industrial CCTV & High-Availability Factory Network Architecture
! Author: Senior Network & Security Infrastructure Architect
! OS: Cisco IOS-XE Amsterdam 17.9.4a (Extended Maintenance)
!==============================================================================

version 17.9
no service pad
service tcp-keepalives-in
service tcp-keepalives-out
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
!
hostname SW-CORE-STK
!
boot-start-marker
boot-end-marker
!
! --- VRF-LITE MICRO-SEGMENTATION ---
vrf definition VRF_CCTV_OT
 description Dedicated Isolated VRF for Industrial Physical Security & CCTV
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
!
! --- AAA, AUTHENTICATION & MANAGEMENT HARDENING ---
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default enable
aaa authorization exec default group radius local
aaa accounting exec default start-stop group radius
!
username secadmin privilege 15 secret 9 $9$8xKa.Z9bW4o$xQ.R1lTfN7/4mK8pQe0Z5J.7L2vO
!
ip domain-name factory.internal
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption chacha20-poly1305@openssh.com aes256-gcm@openssh.com
!
! --- LAYER-2 SECURITY (DHCP SNOOPING & DAI) ---
ip dhcp snooping
ip dhcp snooping vlan 20,21,22
no ip dhcp snooping information option
ip arp inspection vlan 20,21,22
ip arp inspection validate src-mac dst-mac ip
!
! --- GLOBAL SPANNING TREE (MSTP) & SYSTEM MTU ---
system mtu 9198
spanning-tree mode mst
spanning-tree mst configuration
 name FACTORY-CCTV-FABRIC
 revision 1
 instance 1 vlan 20-22,30,50
 instance 2 vlan 40,41
!
spanning-tree mst 0,1,2 priority 4096
spanning-tree portfast edge bpduguard default
!
! --- QUALITY OF SERVICE (MQC) ---
class-map match-any CM-CCTV-CONTROL
 match ip dscp cs5
 match ip dscp ef
!
class-map match-any CM-CCTV-VIDEO-STREAM
 match ip dscp af41
 match ip dscp af42
!
class-map match-any CM-MGMT-TRAFFIC
 match ip dscp cs2
 match ip dscp cs6
!
policy-map PM-CORE-QOS-INGRESS
 class CM-CCTV-CONTROL
  set dscp cs5
  set cos 5
 class CM-CCTV-VIDEO-STREAM
  set dscp af41
  set cos 4
 class CM-MGMT-TRAFFIC
  set dscp cs2
  set cos 2
 class class-default
  set dscp default
  set cos 0
!
policy-map PM-CORE-QOS-EGRESS
 class CM-CCTV-CONTROL
  priority level 1
  police cir percent 5
 class CM-CCTV-VIDEO-STREAM
  bandwidth remaining percent 70
 class CM-MGMT-TRAFFIC
  bandwidth remaining percent 10
 class class-default
  bandwidth remaining percent 20
!
! --- VLAN DEFINITIONS ---
vlan 10
 name OOBM-MGMT
!
vlan 20
 name CCTV-PERIMETER
!
vlan 21
 name CCTV-FACTORY
!
vlan 22
 name CCTV-ANPR-GATE
!
vlan 30
 name VMS-AI-CORE
!
vlan 40
 name STORAGE-SAN-A
!
vlan 41
 name STORAGE-SAN-B
!
vlan 50
 name SOC-CLIENTS
!
vlan 99
 name CORE-FW-TRANSIT
!
vlan 666
 name QUARANTINE-ISOLATION
!
! --- PORT-CHANNELS TO INDUSTRIAL ACCESS SWITCHES (IDF) ---
interface Port-channel1
 description LACP Trunk Uplink to SW-ACC-IDF1 (Perimeter)
 switchport mode trunk
 switchport trunk allowed vlan 10,20,666
 switchport trunk native vlan 666
 switchport nonegotiate
 spanning-tree guard root
 service-policy input PM-CORE-QOS-INGRESS
 service-policy output PM-CORE-QOS-EGRESS
!
interface Port-channel2
 description LACP Trunk Uplink to SW-ACC-IDF2 (Factory Floor)
 switchport mode trunk
 switchport trunk allowed vlan 10,21,666
 switchport trunk native vlan 666
 switchport nonegotiate
 spanning-tree guard root
 service-policy input PM-CORE-QOS-INGRESS
 service-policy output PM-CORE-QOS-EGRESS
!
interface Port-channel3
 description LACP Trunk Uplink to SW-ACC-IDF3 (Logistics & Gates)
 switchport mode trunk
 switchport trunk allowed vlan 10,21,22,666
 switchport trunk native vlan 666
 switchport nonegotiate
 spanning-tree guard root
 service-policy input PM-CORE-QOS-INGRESS
 service-policy output PM-CORE-QOS-EGRESS
!
! --- PORT-CHANNEL TO DELL POWEREDGE R750xa (VMS & AI NODE) ---
interface Port-channel10
 description Dual 10G LACP to Dell PowerEdge VMS-AI Server
 switchport mode trunk
 switchport trunk allowed vlan 30,40,41
 switchport trunk native vlan 666
 switchport nonegotiate
 mtu 9000
 spanning-tree portfast edge trunk
!
! --- PHYSICAL 10G SFP+ PORTS (STACK SWITCH 1 & 2 DIVERSITY) ---
interface TenGigabitEthernet1/0/1
 description Member 1 of PO1 to IDF-1 (Path A)
 switchport mode trunk
 channel-group 1 mode active
!
interface TenGigabitEthernet2/0/1
 description Member 2 of PO1 to IDF-1 (Path B)
 switchport mode trunk
 channel-group 1 mode active
!
interface TenGigabitEthernet1/0/2
 description Member 1 of PO2 to IDF-2 (Path A)
 switchport mode trunk
 channel-group 2 mode active
!
interface TenGigabitEthernet2/0/2
 description Member 2 of PO2 to IDF-2 (Path B)
 switchport mode trunk
 channel-group 2 mode active
!
interface TenGigabitEthernet1/0/3
 description Member 1 of PO3 to IDF-3 (Path A)
 switchport mode trunk
 channel-group 3 mode active
!
interface TenGigabitEthernet2/0/3
 description Member 2 of PO3 to IDF-3 (Path B)
 switchport mode trunk
 channel-group 3 mode active
!
interface TenGigabitEthernet1/0/10
 description NIC 1 to Dell PowerEdge R750xa (PCIe Dual 10G)
 switchport mode trunk
 channel-group 10 mode active
 mtu 9000
!
interface TenGigabitEthernet2/0/10
 description NIC 2 to Dell PowerEdge R750xa (PCIe Dual 10G)
 switchport mode trunk
 channel-group 10 mode active
 mtu 9000
!
! --- STORAGE FABRIC DIRECT SFP+ CONNECTIVITY (NON-ROUTED) ---
interface TenGigabitEthernet1/0/11
 description Direct iSCSI Path to Dell PowerVault ME5012 Controller A Port 0
 switchport access vlan 40
 switchport mode access
 switchport nonegotiate
 mtu 9000
 spanning-tree portfast edge
!
interface TenGigabitEthernet2/0/11
 description Direct iSCSI Path to Dell PowerVault ME5012 Controller B Port 0
 switchport access vlan 41
 switchport mode access
 switchport nonegotiate
 mtu 9000
 spanning-tree portfast edge
!
! --- UPLINK PORT-CHANNEL TO FORTIGATE 100F HA CLUSTER ---
interface Port-channel50
 description Redundant L2/L3 Transit Trunk to FortiGate 100F HA
 switchport mode trunk
 switchport trunk allowed vlan 50,99
 switchport trunk native vlan 666
 switchport nonegotiate
!
interface TenGigabitEthernet1/0/24
 description Link 1 to FortiGate 100F Cluster (FortiLink / Transit)
 switchport mode trunk
 channel-group 50 mode active
!
interface TenGigabitEthernet2/0/24
 description Link 2 to FortiGate 100F Cluster (FortiLink / Transit)
 switchport mode trunk
 channel-group 50 mode active
!
! --- SWITCHED VIRTUAL INTERFACES (SVIs) WITH VRF-LITE ---
interface Vlan10
 description Global Out-of-band Management SVI
 ip address 10.240.10.2 255.255.255.0
 no shutdown
!
interface Vlan20
 description Gateway for Perimeter 4K Cameras (IDF-1)
 vrf forwarding VRF_CCTV_OT
 ip address 10.240.20.1 255.255.255.0
 ip helper-address 10.240.30.10
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Vlan21
 description Gateway for Factory Floor High-Speed Cameras (IDF-2 & 3)
 vrf forwarding VRF_CCTV_OT
 ip address 10.240.21.1 255.255.255.0
 ip helper-address 10.240.30.10
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Vlan22
 description Gateway for ANPR Gate Cameras (IDF-3)
 vrf forwarding VRF_CCTV_OT
 ip address 10.240.22.1 255.255.255.0
 ip helper-address 10.240.30.10
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface Vlan30
 description Gateway for VMS & AI Inference Nodes
 vrf forwarding VRF_CCTV_OT
 ip address 10.240.30.1 255.255.255.240
 no shutdown
!
interface Vlan99
 description L3 Routed Transit Link to FortiGate 100F HA
 vrf forwarding VRF_CCTV_OT
 ip address 10.240.99.2 255.255.255.248
 no shutdown
!
! --- NOTE: VLAN 40 & 41 HAVE NO SVIs (STRICT ISOLATED STORAGE FABRIC) ---
!
! --- ROUTING PROTOCOL (OSPF & DEFAULT ROUTE) ---
router ospf 100 vrf VRF_CCTV_OT
 router-id 10.240.99.2
 log-adjacency-changes
 passive-interface default
 no passive-interface Vlan99
 network 10.240.20.0 0.0.0.255 area 0
 network 10.240.21.0 0.0.255 area 0
 network 10.240.22.0 0.0.0.255 area 0
 network 10.240.30.0 0.0.0.15 area 0
 network 10.240.99.0 0.0.0.7 area 0
!
ip route vrf VRF_CCTV_OT 0.0.0.0 0.0.0.0 10.240.99.1
ip route 0.0.0.0 0.0.0.0 10.240.10.1
!
! --- TIME SYNCHRONIZATION & TELEMETRY ---
ntp server 10.240.10.1 prefer
snmp-server engineID local 80000009030000408CE10001
snmp-server group SECGROUP v3 priv
snmp-server user secuser SECGROUP v3 auth sha MyStr0ngAuthP@ss! priv aes 256 MyStr0ngPr1vP@ss!
snmp-server host 10.240.10.35 version 3 priv secuser
!
! --- SECURED VTY LINES ---
line con 0
 exec-timeout 5 0
 logging synchronous
 stopbits 1
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 transport output none
line vty 5 15
 exec-timeout 10 0
 transport input ssh
 transport output none
!
end
