nt-weight="600" font-size="12">Rule 36712 (ONVIF Authentication Bypass): ENFORCED - BLOCK</text><text x="25" y="425" fill="#34d399" font-weight="600" font-size="12">Zero Inter-Camera Lateral Traffic Detected (Policy 990: DENY)</text>
