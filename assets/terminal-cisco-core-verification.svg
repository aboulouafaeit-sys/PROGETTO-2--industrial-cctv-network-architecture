<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 642" width="100%" height="100%" style="background:#090d16; font-family:'Cascadia Code','Fira Code','Courier New',monospace;">
  <defs>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="940" height="632" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5" filter="url(#termShadow)"/>
  
  <!-- Terminal Title Bar -->
  <rect x="5" y="5" width="940" height="36" rx="8" fill="#161b22"/>
  <circle cx="25" cy="23" r="6" fill="#f85149"/>
  <circle cx="45" cy="23" r="6" fill="#f0883e"/>
  <circle cx="65" cy="23" r="6" fill="#2ea043"/>
  <text x="100" y="27" fill="#8b949e" font-size="12" font-family="'Segoe UI',sans-serif" font-weight="600">SW-CORE-STK (Cisco Catalyst 9300 StackWise-480) — Verification Console</text>

  <!-- Output Lines -->
  <text x="25" y="75" fill="#38bdf8" font-weight="700" font-size="13">SW-CORE-STK# show redundancy</text><text x="25" y="95" fill="#cbd5e1" font-size="12">Redundant System Information :</text><text x="25" y="113" fill="#cbd5e1" font-size="12">------------------------------</text><text x="25" y="131" fill="#cbd5e1" font-size="12">       Current Processor = Slot 1 (Active)</text><text x="25" y="149" fill="#cbd5e1" font-size="12">      Peer Processor     = Slot 2 (Standby Hot)</text><text x="25" y="167" fill="#cbd5e1" font-size="12">Redundancy Mode Current  = sso (Stateful Switchover)</text><text x="25" y="185" fill="#cbd5e1" font-size="12">Operating Mode Current   = sso</text><text x="25" y="203" fill="#34d399" font-weight="600" font-size="12">Communications Current   = Definite (Full Sync Completed)</text><text x="25" y="231" fill="#38bdf8" font-weight="700" font-size="13">SW-CORE-STK# show etherchannel summary</text><text x="25" y="251" fill="#cbd5e1" font-size="12">Group  Port-channel  Protocol    Ports</text><text x="25" y="269" fill="#cbd5e1" font-size="12">------+-------------+-----------+-----------------------------------------------</text><text x="25" y="287" fill="#34d399" font-weight="600" font-size="12">1      Po1(SU)        LACP        Te1/0/1(P)   Te2/0/1(P)   [IDF-1 Trunk Uplink]</text><text x="25" y="305" fill="#34d399" font-weight="600" font-size="12">2      Po2(SU)        LACP        Te1/0/2(P)   Te2/0/2(P)   [IDF-2 Trunk Uplink]</text><text x="25" y="323" fill="#34d399" font-weight="600" font-size="12">3      Po3(SU)        LACP        Te1/0/3(P)   Te2/0/3(P)   [IDF-3 Trunk Uplink]</text><text x="25" y="341" fill="#34d399" font-weight="600" font-size="12">10     Po10(SU)       LACP        Te1/0/10(P)  Te2/0/10(P)  [Dell PowerEdge R750xa]</text><text x="25" y="359" fill="#34d399" font-weight="600" font-size="12">50     Po50(SU)       LACP        Te1/0/24(P)  Te2/0/24(P)  [FortiGate 100F HA]</text><text x="25" y="387" fill="#38bdf8" font-weight="700" font-size="13">SW-CORE-STK# show ip route vrf VRF_CCTV_OT ospf</text><text x="25" y="407" fill="#cbd5e1" font-size="12">Routing Table: VRF_CCTV_OT</text><text x="25" y="425" fill="#34d399" font-weight="600" font-size="12">O*E2  0.0.0.0/0 [110/10] via 10.240.99.1, 4d18h, Vlan99</text><text x="25" y="443" fill="#cbd5e1" font-size="12">      10.0.0.0/8 is variably subnetted, 8 subnets, 4 masks</text><text x="25" y="461" fill="#cbd5e1" font-size="12">C        10.240.20.0/24 is directly connected, Vlan20 (Perimeter)</text><text x="25" y="479" fill="#cbd5e1" font-size="12">C        10.240.21.0/24 is directly connected, Vlan21 (Factory)</text><text x="25" y="497" fill="#cbd5e1" font-size="12">C        10.240.22.0/24 is directly connected, Vlan22 (ANPR)</text><text x="25" y="515" fill="#cbd5e1" font-size="12">C        10.240.30.0/28 is directly connected, Vlan30 (VMS-AI)</text><text x="25" y="543" fill="#38bdf8" font-weight="700" font-size="13">SW-CORE-STK# show ip arp inspection statistics vlan 20-22</text><text x="25" y="563" fill="#cbd5e1" font-size="12">Vlan 20: Forwarded: 142095, Dropped: 0, DHCP Drops: 0</text><text x="25" y="581" fill="#cbd5e1" font-size="12">Vlan 21: Forwarded: 298410, Dropped: 0, DHCP Drops: 0</text><text x="25" y="599" fill="#34d399" font-weight="600" font-size="12">Vlan 22: Forwarded:  48120, Dropped: 0, DHCP Drops: 0 (ZERO MITM ANOMALIES)</text>
</svg>
